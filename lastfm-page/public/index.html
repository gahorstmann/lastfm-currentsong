<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎵 Last.fm Current Song</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #0f0f0f;
        color: #f5f5f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }

      h1 {
        margin-bottom: 0.5rem;
      }

      input {
        padding: 0.5rem 1rem;
        border-radius: 8px;
        border: none;
        outline: none;
        font-size: 1rem;
      }

      button {
        margin-left: 0.5rem;
        padding: 0.5rem 1rem;
        border: none;
        border-radius: 8px;
        background: #ff4757;
        color: white;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        background: #ff6b81;
      }

      .song {
        margin-top: 2rem;
      }

      img {
        border-radius: 8px;
        margin-top: 1rem;
      }
    </style>
  </head>

  <body>
    <h1>🎧 Última música tocada no Last.fm</h1>
    <p>Digite seu usuário do Last.fm:</p>

    <div>
      <input id="username" placeholder="ex: gahorstmann" />
      <button id="fetchBtn">Buscar</button>
    </div>

    <div class="song" id="songInfo"></div>

    <script>
      async function fetchSong() {
        const user = document.getElementById("username").value.trim();
        const songInfo = document.getElementById("songInfo");
        songInfo.innerHTML = "Carregando...";

        if (!user) {
          songInfo.innerHTML = "Por favor, insira um usuário do Last.fm.";
          return;
        }

        try {
          const res = await fetch(`https://lastfm.apigamers.com/?user=${user}`);
          if (!res.ok) {
            songInfo.innerHTML = "Erro ao buscar dados.";
            return;
          }

          const data = await res.json();

          if (!data) {
            songInfo.innerHTML = "Nenhuma música encontrada.";
            return;
          }

          songInfo.innerHTML = `
            <h2>${data.artist} - ${data.name}</h2>
            <p><strong>Álbum:</strong> ${data.album}</p>
            ${
              data.image
                ? `<img src="${data.image}" alt="Capa do álbum" />`
                : ""
            }
            <p>${data.nowPlaying ? "🎵 Tocando agora" : "⏸️ Última ouvida"}</p>
          `;
        } catch (err) {
          songInfo.innerHTML = "Erro ao carregar informações.";
          console.error(err);
        }
      }

      document.getElementById("fetchBtn").addEventListener("click", fetchSong);
    </script>
  </body>
</html>
